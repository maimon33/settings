<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Settings manager</title><link rel="stylesheet" href="style.css"></head>
<body><main><h1>Settings manager</h1><p>Local-only backup controls and activity.</p>
